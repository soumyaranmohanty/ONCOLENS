[project]
name = "oncolens"
version = "0.1.0"
description = "ONCOLENS — TCGA LUAD multimodal survival and staging prediction"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn==1.8.0",
    "joblib",
    "matplotlib",
    "jupyter",
    "ipykernel",
    "seaborn",
    "requests",
]

[project.optional-dependencies]
histopathology = [
    "torch",
    "torchvision",
    "openslide-python",
    "Pillow",
    "histolab",
    "opencv-python",
]
app = ["streamlit>=1.33", "plotly", "reportlab"]
llm = [
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
]

[tool.uv]
package = false
